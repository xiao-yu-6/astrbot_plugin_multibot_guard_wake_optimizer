name: astrbot_plugin_peer_context_guard
display_name: 多机器人群聊防互聊及唤醒优化
short_desc: 按实例与群聊配置机器人过滤、独立唤醒词、上下文接话和可选语义判断。
desc: >-
  面向 QQ 群聊的多机器人发送者过滤与唤醒插件，使用 aiocqhttp（OneBot v11）适配器。
  按机器人实例和群聊设置通讯录，根据登记的 QQ 号过滤机器人发送者，减少相互触发。
  支持实例通用正则与群聊专用覆盖，可在 @ 或关键词唤醒时附带近期文字上下文。
  可选保存并注入机器人只读历史；空唤醒可沿用原设置、立即接话或等待同一人补充，
  也可设置回复后再接一条。语义辅助支持正则命中后复核或聚合消息后的独立巡检。
  配置入口：插件详情 → 配置中心（settings）。
  首次安装内部功能总开关关闭，语义辅助和自定义接话默认关闭；不提供按概率随机回复。
version: 0.7.7
author: xiao-yu-6
astrbot_version: ">=4.29.1,<5"
support_platforms:
  - aiocqhttp
category: utilities
tags:
  - QQ
